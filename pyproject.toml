[project]
name = "davpunk"
version = "0.1.0"
description = "Work it. Sync it. Check it. Done. — a power-user CalDAV VTODO client for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manuel Herrmann" }]
dependencies = [
    "requests>=2.32",
    "icalendar>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tomlkit>=0.13",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
mcp = ["mcp>=1.2"]
notify = ["jeepney>=0.8"]

[project.scripts]
davpunk = "davpunk.__main__:main"
davpunk-sync = "davpunk.daemon.sync_daemon:main"
davpunk-mcp = "davpunk.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "responses>=0.25",
    "mypy>=1.10",
    "ruff>=0.5",
    "radicale>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/davpunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "radicale: integration tests that spawn a real Radicale server",
    "qt: tests that need a Qt runtime",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: the HLD names the conflict dialog modes A / A′ / B,
# and that prime is the notation, not a typo for a grave accent.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.11"
packages = ["davpunk"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
