repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs from *your* environment rather than an isolated one pre-commit
  # builds for it.  The isolated form needs every typed dependency listed by
  # hand, and PySide6 is far too large to want there — but leaving it out does
  # not make the UI check loosely, it makes it not check at all: with no stubs
  # to find, every Qt call becomes `Any` and the whole `davpunk.ui` package
  # passes vacuously.  A local hook cannot drift from what `mypy` tells you at
  # the terminal, which is the property that matters here.
  #
  # It therefore needs mypy on PATH: `nix develop`, or `uv sync --all-extras`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
